version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # We stream the domain type (TelemetryFrame) directly and use domain names for the service/RPC,
    # rather than the Method{Request,Response} wrapper convention buf's STANDARD prefers.
    - SERVICE_SUFFIX
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
