# GARAGE backend stack.
#
#   docker compose up --build              # timescaledb + rtps (ingest :50051, API :8080)
#   docker compose --profile live up        # ...also the collector (needs a real PS5 + host net)
#
# The collector is gated behind the `live` profile because it only does anything with a real PS5 on
# the LAN and it must use host networking (a bridge network can't receive the console's UDP). Set the
# console IP first, e.g.  PS5_IP=192.168.1.99 docker compose --profile live up --build
name: garage

services:
  # TimescaleDB (Postgres + time-series). rtps runs its embedded goose migrations against this on
  # startup, including the lap_trace hypertable + `CREATE EXTENSION timescaledb` (migration 00003).
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: gt7
      POSTGRES_PASSWORD: gt7
      POSTGRES_DB: gt7
    ports:
      - "5432:5432" # exposed for host-side psql/debugging; drop if you don't need it
    volumes:
      - garage-tsdb:/var/lib/postgresql/data
    healthcheck:
      # rtps depends on this being ready — pg_isready gates startup ordering below.
      test: ["CMD-SHELL", "pg_isready -U gt7 -d gt7"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The backend: gRPC telemetry ingest + HTTP read API. Bound to 0.0.0.0 so the published ports are
  # reachable from the host (and from the host-networked collector via localhost:50051).
  rtps:
    build:
      context: .
      dockerfile: Dockerfile.rtps
    command:
      - "--storage=postgres"
      - "--db.dsn=postgres://gt7:gt7@timescaledb:5432/gt7?sslmode=disable"
      - "--api.addr=0.0.0.0:8080"
      - "--ingest.addr=0.0.0.0:50051"
      - "--log.level=info"
    ports:
      - "8080:8080"   # HTTP read API
      - "50051:50051" # telemetry ingest gRPC
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: on-failure

  # The GT7 telemetry collector. host networking is REQUIRED to receive the PS5's UDP on :33740 (and
  # ignores compose port maps). Reaches rtps at localhost:50051 because rtps publishes that port to the
  # host. Only starts under `--profile live`.
  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    # PS5_IP is interpolated for the whole file up front (before profiles apply), so it must not be
    # hard-required here or it would block the default `docker compose up`. Left empty by default; set
    # it for the live run — `PS5_IP=192.168.1.99 docker compose --profile live up` — otherwise the
    # collector exits with the config layer's "ps5.ip required" error.
    command:
      - "--ps5.ip=${PS5_IP:-}"
      - "--rtps.addr=127.0.0.1:50051"
      - "--log.level=info"
    network_mode: host
    depends_on:
      - rtps
    restart: on-failure
    profiles: ["live"]

volumes:
  garage-tsdb:
