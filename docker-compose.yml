# GARAGE backend stack.
#
#   PS5_IP=192.168.1.99 docker compose up --build   # timescaledb + rtps (in-process collector,
#                                                   # ingest :50051, API + dashboard :8080)
#
# rtps runs the GT7 UDP collector in-process, so it needs the console IP and host networking (a bridge
# network can't receive the console's UDP on :33740). Without PS5_IP, rtps exits with the config
# layer's "one of --ps5.ip or --replay-file is required" error.
name: garage

services:
  # TimescaleDB (Postgres + time-series). rtps runs its embedded goose migrations against this on
  # startup, including the lap_trace hypertable + `CREATE EXTENSION timescaledb` (migration 00003).
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: gt7
      POSTGRES_PASSWORD: gt7
      POSTGRES_DB: gt7
    ports:
      - "5432:5432" # exposed for host-side psql/debugging; drop if you don't need it
    volumes:
      - garage-tsdb:/var/lib/postgresql/data
    healthcheck:
      # rtps depends on this being ready — pg_isready gates startup ordering below.
      test: ["CMD-SHELL", "pg_isready -U gt7 -d gt7"]
      interval: 5s
      timeout: 3s
      retries: 10

  # rtps: in-process GT7 collector + gRPC telemetry ingest + HTTP read API + dashboard. host networking
  # is REQUIRED to receive the PS5's UDP on :33740 (compose port maps are ignored under host networking;
  # the API/ingest listen on the host's 0.0.0.0:8080/:50051 directly). It reaches timescaledb through
  # the port that service publishes on the host (localhost:5432).
  rtps:
    build:
      context: .
      dockerfile: Dockerfile.rtps
    # PS5_IP is left empty by default so `docker compose config` etc. don't hard-fail on interpolation;
    # rtps itself rejects an empty ps5.ip at startup.
    command:
      - "--ps5.ip=${PS5_IP:-}"
      - "--storage=postgres"
      - "--db.dsn=postgres://gt7:gt7@localhost:5432/gt7?sslmode=disable"
      - "--api.addr=0.0.0.0:8080"
      - "--ingest.addr=0.0.0.0:50051"
      - "--log.level=info"
    network_mode: host
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: on-failure

volumes:
  garage-tsdb:
