site_name: GARAGE Backend
site_description: Documentation for the GARAGE telemetry backend (collector, RTPS, and tools).
repo_url: https://github.com/arush-sal/garage
docs_dir: docs

theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - HTTP API: api.md
  - Terminal dashboard: tui.md
  - Tools:
      - Overview: tools/index.md
      - pcap2csv: tools/pcap2csv.md
      - vd2csv: tools/vd2csv.md
      - rkb: tools/rkb.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
